services:
  backend:
    build:
      context: ./app/backend
    container_name: sentinelcart-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - sentinelcart-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./app/frontend
    container_name: sentinelcart-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinelcart-network

networks:
  sentinelcart-network:
    driver: bridge
